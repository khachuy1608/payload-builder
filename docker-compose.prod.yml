# Production: Postgres + app (standalone) + Caddy tự cấp HTTPS (Let's Encrypt).
#   DOMAIN=example.com PAYLOAD_SECRET=... docker compose -f docker-compose.prod.yml up -d --build
# Biến môi trường đặt trong .env cùng thư mục (DOMAIN, PAYLOAD_SECRET, POSTGRES_PASSWORD, SMTP_*).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: builder
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-builder}
      POSTGRES_DB: builder
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U builder -d builder']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URI: postgres://builder:${POSTGRES_PASSWORD:-builder}@db:5432/builder
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?Hãy đặt PAYLOAD_SECRET}
      NEXT_PUBLIC_SERVER_URL: https://${DOMAIN:?Hãy đặt DOMAIN}
      PAYLOAD_RUN_JOBS: 'true'
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@${DOMAIN}}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    volumes:
      - media:/app/media
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(''http://127.0.0.1:3000/api/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 30s
      timeout: 10s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
